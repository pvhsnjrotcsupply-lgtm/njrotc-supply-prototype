<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PVHS NJROTC Supply</title>

    <!-- Barcode Scanner Library -->
    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
    </script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            background: #f2f2f2;

            margin: 0;

            padding: 20px;

        }


        .container {

            max-width: 500px;

            margin: auto;

        }


        .header {

            background: #111;

            color: white;

            padding: 20px;

            text-align: center;

            border-radius: 12px;

        }


        .header h1 {

            margin: 0 0 5px 0;

        }


        .header div {

            font-size: 14px;

            opacity: 0.8;

        }


        .card {

            background: white;

            padding: 20px;

            margin-top: 15px;

            border-radius: 12px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.1);

        }


        button {

            width: 100%;

            padding: 16px;

            margin-top: 10px;

            border: none;

            border-radius: 8px;

            background: #222;

            color: white;

            font-size: 18px;

            cursor: pointer;

        }


        button.secondary {

            background: #777;

        }


        button.success {

            background: #087f23;

        }


        button:disabled {

            background: #aaa;

            cursor: not-allowed;

        }


        input {

            width: 100%;

            box-sizing: border-box;

            padding: 14px;

            font-size: 18px;

            margin-top: 8px;

            border: 1px solid #ccc;

            border-radius: 8px;

        }


        .hidden {

            display: none !important;

        }


        .student-name {

            font-size: 26px;

            font-weight: bold;

        }


        .item-name {

            font-size: 22px;

            font-weight: bold;

        }


        .status {

            padding: 15px;

            margin-top: 15px;

            border-radius: 8px;

            background: #eee;

            line-height: 1.5;

        }


        .status.success {

            background: #dff4e4;

            color: #155724;

        }


        .status.error {

            background: #f8d7da;

            color: #721c24;

        }


        .status.processing {

            background: #fff3cd;

            color: #856404;

        }


        #reader {

            width: 100%;

            margin-top: 15px;

        }


        .small {

            font-size: 13px;

            color: #666;

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <div class="header">

        <h1>PVHS NJROTC</h1>

        <div>
            SUPPLY PROTOTYPE — v0.3-PROTO
        </div>

    </div>



    <!-- =====================================================
         HOME
         ===================================================== -->

    <div
        id="home"
        class="card">

        <h2>Supply</h2>

        <p>
            Scan a student's school ID to begin.
        </p>


        <button
            onclick="startStudentScan()">

            📷 Scan Student ID

        </button>


        <button
            class="secondary"
            onclick="manualStudent()">

            ⌨️ Enter Student ID Manually

        </button>

    </div>



    <!-- =====================================================
         STUDENT
         ===================================================== -->

    <div
        id="studentCard"
        class="card hidden">

        <h2>Student</h2>


        <div
            id="studentName"
            class="student-name">
        </div>


        <p
            id="studentDetails">
        </p>


        <button
            onclick="startItemScan()">

            📷 Scan Item

        </button>


        <button
            class="secondary"
            onclick="manualItem()">

            ⌨️ Enter Item Barcode Manually

        </button>


        <button
            class="secondary"
            onclick="resetApp()">

            Cancel

        </button>

    </div>



    <!-- =====================================================
         ITEM
         ===================================================== -->

    <div
        id="itemCard"
        class="card hidden">

        <h2>Item</h2>


        <div
            id="itemName"
            class="item-name">
        </div>


        <p
            id="itemDetails">
        </p>


        <button
            id="issueButton"
            class="success"
            onclick="issueItem()">

            ✓ Confirm Issue

        </button>


        <button
            class="secondary"
            onclick="resetApp()">

            Cancel

        </button>

    </div>



    <!-- =====================================================
         SCANNER
         ===================================================== -->

    <div
        id="scannerCard"
        class="card hidden">

        <h2
            id="scannerTitle">

            Scan

        </h2>


        <div id="reader"></div>


        <button
            class="secondary"
            onclick="stopScanner()">

            Cancel Scan

        </button>

    </div>



    <!-- =====================================================
         MANUAL ENTRY
         ===================================================== -->

    <div
        id="manualCard"
        class="card hidden">

        <h2
            id="manualTitle">

            Manual Entry

        </h2>


        <input
            id="manualInput"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="Enter barcode">


        <button
            class="success"
            onclick="submitManualEntry()">

            Look Up

        </button>


        <button
            class="secondary"
            onclick="resetApp()">

            Cancel

        </button>

    </div>



    <!-- =====================================================
         STATUS
         ===================================================== -->

    <div
        id="statusCard"
        class="card hidden">

        <h2
            id="statusTitle">
        </h2>


        <div
            id="statusMessage"
            class="status">
        </div>


        <button
            onclick="resetApp()">

            Start Another Transaction

        </button>

    </div>


</div>



<script>


/* =========================================================
   CONFIGURATION
   ========================================================= */

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbw11OfZGhx0GB6GSvyod9G5MKR3ymAPtUW_6MJMcqbvnrSofMPRzXxfOWazhDPoUorm/exec";



/* =========================================================
   STATE
   ========================================================= */

let currentStudent = null;

let currentItem = null;

let scanner = null;

let scannerMode = null;



/* =========================================================
   STUDENT SCANNING
   ========================================================= */

function startStudentScan() {

    scannerMode = "student";

    showScanner(
        "Scan Student ID"
    );

}



/* =========================================================
   ITEM SCANNING
   ========================================================= */

function startItemScan() {

    scannerMode = "item";

    showScanner(
        "Scan Item Barcode"
    );

}



/* =========================================================
   SHOW SCANNER
   ========================================================= */

function showScanner(title) {

    hideAllCards();


    document
        .getElementById("scannerCard")
        .classList
        .remove("hidden");


    document
        .getElementById("scannerTitle")
        .innerText = title;


    /*
     * Clear the previous scanner container.
     */

    document
        .getElementById("reader")
        .innerHTML = "";


    scanner =
        new Html5Qrcode("reader");


    scanner.start(

        {
            facingMode: "environment"
        },

        {

            fps: 10,

            qrbox: {

                width: 280,

                height: 120

            }

        },

        function(decodedText) {

            stopScanner();

            handleBarcode(decodedText);

        },

        function(errorMessage) {

            /*
             * Continuous scanner errors
             * are intentionally ignored.
             */

        }

    )

    .catch(function(error) {

        console.error(
            "Scanner error:",
            error
        );


        showError(
            "Camera could not start.\n\n" +
            error
        );

    });

}



/* =========================================================
   STOP SCANNER
   ========================================================= */

function stopScanner() {

    if (!scanner) {

        document
            .getElementById("scannerCard")
            .classList
            .add("hidden");

        return;

    }


    const oldScanner =
        scanner;


    scanner = null;


    oldScanner
        .stop()
        .then(function() {

            try {

                oldScanner.clear();

            }

            catch (error) {

                console.log(
                    "Scanner clear error:",
                    error
                );

            }

        })

        .catch(function(error) {

            console.log(
                "Scanner stop error:",
                error
            );

            try {

                oldScanner.clear();

            }

            catch (e) {}

        });


    document
        .getElementById("scannerCard")
        .classList
        .add("hidden");

}



/* =========================================================
   BARCODE HANDLER
   ========================================================= */

function handleBarcode(barcode) {

    barcode =
        String(barcode)
            .trim();


    if (!barcode) {

        showError(
            "The scanner returned an empty barcode."
        );

        return;

    }


    console.log(
        "Scanned barcode:",
        barcode
    );


    if (
        scannerMode === "student"
    ) {

        lookupStudent(
            barcode
        );

        return;

    }


    if (
        scannerMode === "item"
    ) {

        lookupItem(
            barcode
        );

        return;

    }

}



/* =========================================================
   LOOKUP STUDENT
   ========================================================= */

function lookupStudent(studentId) {

    showProcessing(
        "Finding student..."
    );


    console.log(
        "Looking up student:",
        studentId
    );


    postData({

        action: "lookupStudent",

        studentId: String(studentId)

    })

    .then(function(result) {

        console.log(
            "Student lookup result:",
            result
        );


        if (!result.success) {

            showError(
                result.message
            );

            return;

        }


        currentStudent =
            result.data.student;


        document
            .getElementById(
                "studentName"
            )
            .innerText =

                currentStudent.firstName +
                " " +
                currentStudent.lastName;


        document
            .getElementById(
                "studentDetails"
            )
            .innerText =

                "ID: " +
                currentStudent.id +

                " | Grade: " +
                currentStudent.grade +

                " | " +
                currentStudent.company +

                " Company | " +

                currentStudent.platoon +

                " Platoon";


        document
            .getElementById(
                "home"
            )
            .classList
            .add("hidden");


        document
            .getElementById(
                "studentCard"
            )
            .classList
            .remove("hidden");

    })

    .catch(function(error) {

        console.error(
            "Student lookup error:",
            error
        );


        showError(
            "Could not contact the Supply server.\n\n" +
            error.message
        );

    });

}



/* =========================================================
   LOOKUP ITEM
   ========================================================= */

function lookupItem(itemBarcode) {

    if (!currentStudent) {

        showError(
            "No student has been selected."
        );

        return;

    }


    showProcessing(
        "Finding item..."
    );


    console.log(
        "Looking up item:",
        itemBarcode
    );


    postData({

        action: "lookupItem",

        studentId:
            String(currentStudent.id),

        itemBarcode:
            String(itemBarcode)

    })

    .then(function(result) {

        console.log(
            "Item lookup result:",
            result
        );


        if (!result.success) {

            showError(
                result.message
            );

            return;

        }


        currentItem =
            result.data.item;


        document
            .getElementById(
                "itemName"
            )
            .innerText =

                currentItem.itemName +
                " — " +
                currentItem.size;


        document
            .getElementById(
                "itemDetails"
            )
            .innerText =

                "Item Code: " +
                currentItem.itemCode +

                " | Category: " +
                currentItem.category +

                " | Barcode: " +
                currentItem.barcode;


        document
            .getElementById(
                "studentCard"
            )
            .classList
            .add("hidden");


        document
            .getElementById(
                "itemCard"
            )
            .classList
            .remove("hidden");


    })

    .catch(function(error) {

        console.error(
            "Item lookup error:",
            error
        );


        showError(
            "Could not contact the Supply server.\n\n" +
            error.message
        );

    });

}



/* =========================================================
   ISSUE ITEM
   ========================================================= */

function issueItem() {

    if (!currentStudent) {

        showError(
            "No student is selected."
        );

        return;

    }


    if (!currentItem) {

        showError(
            "No item is selected."
        );

        return;

    }


    /*
     * Disable the button immediately.
     * This prevents accidental double submissions.
     */

    const button =
        document.getElementById(
            "issueButton"
        );


    button.disabled = true;

    button.innerText =
        "Processing...";


    showProcessing(
        "Processing issue..."
    );


    const request = {

        action: "issue",

        studentId:
            String(currentStudent.id),

        itemBarcode:
            String(currentItem.barcode),

        clerk:
            "Prototype Clerk"

    };


    console.log(
        "Sending issue request:",
        request
    );


    postData(
        request
    )

    .then(function(result) {

        console.log(
            "Issue response:",
            result
        );


        if (!result) {

            throw new Error(
                "The server returned an empty response."
            );

        }


        if (result.success) {

            showSuccess(

                "✓ Issue Successful",

                result.message

            );

        }

        else {

            showError(
                result.message ||
                "Issue failed."
            );

        }

    })

    .catch(function(error) {

        console.error(
            "ISSUE ERROR:",
            error
        );


        showError(

            "The issue request failed.\n\n" +
            error.message

        );

    })

    .finally(function() {

        /*
         * Restore the button.
         */

        button.disabled = false;

        button.innerText =
            "✓ Confirm Issue";

    });

}



/* =========================================================
   MANUAL STUDENT
   ========================================================= */

function manualStudent() {

    hideAllCards();


    document
        .getElementById(
            "manualCard"
        )
        .classList
        .remove("hidden");


    document
        .getElementById(
            "manualTitle"
        )
        .innerText =
            "Enter Student ID";


    const input =
        document.getElementById(
            "manualInput"
        );


    input.value = "";

    input.placeholder =
        "Enter Student ID";


    input.focus();

}



/* =========================================================
   MANUAL ITEM
   ========================================================= */

function manualItem() {

    if (!currentStudent) {

        showError(
            "Please select a student first."
        );

        return;

    }


    hideAllCards();


    document
        .getElementById(
            "manualCard"
        )
        .classList
        .remove("hidden");


    document
        .getElementById(
            "manualTitle"
        )
        .innerText =
            "Enter Item Barcode";


    const input =
        document.getElementById(
            "manualInput"
        );


    input.value = "";

    input.placeholder =
        "Enter Item Barcode";


    input.focus();

}



/* =========================================================
   MANUAL ENTRY SUBMISSION
   ========================================================= */

function submitManualEntry() {

    const input =
        document.getElementById(
            "manualInput"
        );


    const value =
        input.value.trim();


    if (!value) {

        alert(
            "Please enter a barcode."
        );

        input.focus();

        return;

    }


    /*
     * If there is no student yet,
     * this is a student ID.
     */

    if (!currentStudent) {

        lookupStudent(
            value
        );

        return;

    }


    /*
     * Otherwise it is an item barcode.
     */

    lookupItem(
        value
    );

}



/* =========================================================
   POST DATA
   ========================================================= */

function postData(data) {

    console.log(
        "POST:",
        data
    );


    return fetch(

        APPS_SCRIPT_URL,

        {

            method:
                "POST",

            headers: {

                "Content-Type":
                    "text/plain;charset=utf-8"

            },

            body:
                JSON.stringify(data)

        }

    )

    .then(function(response) {

        console.log(
            "HTTP status:",
            response.status
        );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        return response.text();

    })

    .then(function(text) {

        console.log(
            "Raw server response:",
            text
        );


        if (!text) {

            throw new Error(
                "Server returned an empty response."
            );

        }


        try {

            return JSON.parse(text);

        }

        catch (error) {

            console.error(
                "JSON parse error:",
                error
            );


            throw new Error(
                "Server returned invalid JSON:\n\n" +
                text
            );

        }

    });

}



/* =========================================================
   PROCESSING SCREEN
   ========================================================= */

function showProcessing(message) {

    hideAllCards();


    document
        .getElementById(
            "statusCard"
        )
        .classList
        .remove("hidden");


    document
        .getElementById(
            "statusTitle"
        )
        .innerText =
            "Please Wait";


    const messageBox =
        document.getElementById(
            "statusMessage"
        );


    messageBox
        .className =
            "status processing";


    messageBox
        .innerText =
            message;

}



/* =========================================================
   SUCCESS SCREEN
   ========================================================= */

function showSuccess(
    title,
    message
) {

    hideAllCards();


    document
        .getElementById(
            "statusCard"
        )
        .classList
        .remove("hidden");


    document
        .getElementById(
            "statusTitle"
        )
        .innerText =
            title;


    const messageBox =
        document.getElementById(
            "statusMessage"
        );


    messageBox
        .className =
            "status success";


    messageBox
        .innerText =
            message;

}



/* =========================================================
   ERROR SCREEN
   ========================================================= */

function showError(message) {

    hideAllCards();


    document
        .getElementById(
            "statusCard"
        )
        .classList
        .remove("hidden");


    document
        .getElementById(
            "statusTitle"
        )
        .innerText =
            "⚠ Error";


    const messageBox =
        document.getElementById(
            "statusMessage"
        );


    messageBox
        .className =
            "status error";


    messageBox
        .innerText =
            message;

}



/* =========================================================
   HIDE ALL CARDS
   ========================================================= */

function hideAllCards() {

    const ids = [

        "home",

        "studentCard",

        "itemCard",

        "scannerCard",

        "manualCard",

        "statusCard"

    ];


    ids.forEach(function(id) {

        const element =
            document.getElementById(id);


        if (element) {

            element
                .classList
                .add("hidden");

        }

    });

}



/* =========================================================
   RESET
   ========================================================= */

function resetApp() {

    /*
     * Stop scanner first.
     */

    if (scanner) {

        const oldScanner =
            scanner;


        scanner = null;


        oldScanner
            .stop()
            .then(function() {

                try {

                    oldScanner.clear();

                }

                catch (e) {}

            })

            .catch(function() {

                try {

                    oldScanner.clear();

                }

                catch (e) {}

            });

    }


    currentStudent = null;

    currentItem = null;

    scannerMode = null;


    /*
     * Reset issue button.
     */

    const button =
        document.getElementById(
            "issueButton"
        );


    if (button) {

        button.disabled = false;

        button.innerText =
            "✓ Confirm Issue";

    }


    hideAllCards();


    document
        .getElementById(
            "home"
        )
        .classList
        .remove("hidden");

}



/* =========================================================
   PAGE INITIALIZATION
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        console.log(
            "PVHS NJROTC Supply loaded."
        );

        console.log(
            "Apps Script:",
            APPS_SCRIPT_URL
        );

    }
);


</script>

</body>

</html>
