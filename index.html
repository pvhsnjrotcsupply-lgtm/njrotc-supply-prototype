<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbw11OfZGhx0GB6GSvyod9G5MKR3ymAPtUW_6MJMcqbvnrSofMPRzXxfOWazhDPoUorm/exec";


/* =========================================================
   STATE
   ========================================================= */

let currentStudent = null;
let currentItem = null;
let oldItem = null;
let newItem = null;

let currentMode = null;

let scanner = null;
let scannerMode = null;


/* =========================================================
   INITIALIZATION
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function () {
        loadClerk();
    }
);


function loadClerk() {

    const saved =
        localStorage.getItem(
            "njrotc_supply_clerk"
        );

    if (saved) {

        document
            .getElementById("clerkName")
            .value = saved;

    }

}


function saveClerk() {

    const clerk =
        document
            .getElementById("clerkName")
            .value
            .trim();

    if (clerk) {

        localStorage.setItem(
            "njrotc_supply_clerk",
            clerk
        );

    }

    return clerk || "Unknown Clerk";
}


/* =========================================================
   MODES
   ========================================================= */

function startIssue() {

    currentMode = "issue";

    startStudentInput();
}


function startReturn() {

    currentMode = "return";

    startStudentInput();
}


function startExchange() {

    currentMode = "exchange";

    startStudentInput();
}


function startViewCadet() {

    currentMode = "view";

    startStudentInput();
}


/* =========================================================
   STUDENT INPUT
   ========================================================= */

function startStudentInput() {

    hideAllCards();

    showStudentInput();
}


function showStudentInput() {

    const card =
        document.getElementById("home");

    const html = `

        <h2>${getModeTitle()}</h2>

        <p>
            Scan the student's school ID
            or enter the ID manually.
        </p>

        <button onclick="startStudentScan()">
            📷 Scan Student ID
        </button>

        <button
            class="secondary"
            onclick="manualStudent()">
            ⌨️ Enter Student ID
        </button>

        <button
            class="secondary"
            onclick="resetApp()">
            Cancel
        </button>

    `;

    card.innerHTML = html;

    card.classList.remove("hidden");
}


function getModeTitle() {

    if (currentMode === "issue")
        return "Issue Item";

    if (currentMode === "return")
        return "Return Item";

    if (currentMode === "exchange")
        return "Exchange Item";

    if (currentMode === "view")
        return "View Cadet";

    return "Supply";
}


/* =========================================================
   STUDENT SCANNING
   ========================================================= */

function startStudentScan() {

    scannerMode = "student";

    showScanner("Scan Student ID");
}


function manualStudent() {

    hideAllCards();

    document
        .getElementById("manualCard")
        .classList
        .remove("hidden");

    document
        .getElementById("manualTitle")
        .innerText =
            "Enter Student ID";

    const input =
        document.getElementById("manualInput");

    input.value = "";

    input.placeholder =
        "Enter Student ID";

    input.focus();
}


function lookupStudent(studentId) {

    showLoading("Finding student...");

    postData({

        action: "lookupStudent",

        studentId: String(studentId).trim()

    })

    .then(function (result) {

        console.log(
            "lookupStudent response:",
            result
        );

        if (!result.success) {

            showError(
                result.message ||
                "Student could not be found."
            );

            return;
        }

        if (
            !result.data ||
            !result.data.student
        ) {

            showError(
                "The Supply server found the student, " +
                "but returned incomplete student information."
            );

            return;
        }

        currentStudent =
            result.data.student;

        if (currentMode === "view") {

            loadCadet();

            return;
        }

        showStudentConfirmation();

    })

    .catch(function (error) {

        console.error(
            "lookupStudent error:",
            error
        );

        showError(
            "Could not contact Supply server.\n\n" +
            error.message
        );

    });
}


/* =========================================================
   STUDENT CONFIRMATION
   ========================================================= */

function showStudentConfirmation() {

    hideAllCards();

    let cardId = "studentCard";

    if (currentMode === "return") {

        cardId =
            "returnStudentCard";

    }

    else if (
        currentMode === "exchange"
    ) {

        cardId =
            "exchangeStudentCard";

    }

    const card =
        document.getElementById(cardId);

    const name =
        currentStudent.firstName +
        " " +
        currentStudent.lastName;

    if (currentMode === "issue") {

        document
            .getElementById("studentName")
            .innerText = name;

        document
            .getElementById("studentDetails")
            .innerText =
                formatStudentDetails();

    }

    if (currentMode === "return") {

        document
            .getElementById("returnStudentName")
            .innerText = name;

        document
            .getElementById("returnStudentDetails")
            .innerText =
                formatStudentDetails();

    }

    if (currentMode === "exchange") {

        document
            .getElementById("exchangeStudentName")
            .innerText = name;

        document
            .getElementById("exchangeStudentDetails")
            .innerText =
                formatStudentDetails();

    }

    card.classList.remove("hidden");
}


function formatStudentDetails() {

    return (

        "ID: " +
        currentStudent.id +

        " | Grade: " +
        currentStudent.grade +

        " | " +
        currentStudent.company +

        " Company | " +

        currentStudent.platoon +

        " Platoon"

    );
}


/* =========================================================
   ITEM SCANNING
   ========================================================= */

function startItemScan() {

    scannerMode = "item";

    showScanner(
        getItemScanTitle()
    );
}


function getItemScanTitle() {

    if (
        currentMode === "exchange" &&
        oldItem
    ) {

        return "Scan New Item";
    }

    if (currentMode === "return") {

        return "Scan Item to Return";
    }

    return "Scan Item Barcode";
}


function manualItem() {

    hideAllCards();

    document
        .getElementById("manualCard")
        .classList
        .remove("hidden");

    document
        .getElementById("manualTitle")
        .innerText =
            getItemScanTitle();

    const input =
        document.getElementById("manualInput");

    input.value = "";

    input.placeholder =
        "Enter Item Barcode";

    input.focus();
}


/* =========================================================
   ITEM LOOKUP
   ========================================================= */

function lookupItem(itemBarcode) {

    showLoading("Finding item...");

    const cleanBarcode =
        String(itemBarcode).trim();

    console.log(
        "Looking up item barcode:",
        cleanBarcode
    );

    postData({

        action: "lookupItem",

        studentId:
            currentStudent.id,

        itemBarcode:
            cleanBarcode

    })

    .then(function (result) {

        console.log(
            "lookupItem response:",
            result
        );

        if (!result.success) {

            showError(
                result.message ||
                "Item could not be found."
            );

            return;
        }

        if (
            !result.data ||
            !result.data.item
        ) {

            showError(
                "The Supply server found the item, " +
                "but returned incomplete item information."
            );

            return;
        }

        const item =
            result.data.item;

        /*
         * =====================================================
         * IMPORTANT
         *
         * Normalize the barcode property.
         *
         * Depending on the Apps Script response, the property
         * may be called itemBarcode or barcode.
         * =====================================================
         */

        item.barcode =
            item.itemBarcode ||
            item.barcode ||
            cleanBarcode;

        item.itemBarcode =
            item.itemBarcode ||
            item.barcode ||
            cleanBarcode;

        console.log(
            "Normalized item:",
            item
        );


        /* =====================================================
           EXCHANGE
           ===================================================== */

        if (
            currentMode === "exchange" &&
            oldItem
        ) {

            newItem = item;

            showExchangeConfirmation();

            return;
        }


        /* =====================================================
           EXCHANGE FIRST ITEM
           ===================================================== */

        if (
            currentMode === "exchange"
        ) {

            oldItem = item;

            showOldItem();

            return;
        }


        /* =====================================================
           NORMAL ISSUE / RETURN
           ===================================================== */

        currentItem = item;

        showItemConfirmation();

    })

    .catch(function (error) {

        console.error(
            "lookupItem error:",
            error
        );

        showError(
            "Could not contact Supply server.\n\n" +
            error.message
        );

    });
}


/* =========================================================
   ITEM CONFIRMATION
   ========================================================= */

function showItemConfirmation() {

    hideAllCards();

    const card =
        document.getElementById("itemCard");

    let title = "Item";

    if (currentMode === "issue") {

        title =
            "Confirm Issue";

    }

    else if (
        currentMode === "return"
    ) {

        title =
            "Confirm Return";
    }

    document
        .getElementById("itemActionTitle")
        .innerText = title;

    document
        .getElementById("itemName")
        .innerText =
            currentItem.itemName +
            " — " +
            currentItem.size;

    document
        .getElementById("itemDetails")
        .innerText =
            "Item Code: " +
            currentItem.itemCode +
            " | Category: " +
            currentItem.category;

    card.classList.remove("hidden");
}


/* =========================================================
   EXCHANGE
   ========================================================= */

function showOldItem() {

    hideAllCards();

    document
        .getElementById("oldItemName")
        .innerText =
            oldItem.itemName +
            " — " +
            oldItem.size;

    document
        .getElementById("oldItemDetails")
        .innerText =
            "Item Code: " +
            oldItem.itemCode;

    document
        .getElementById("exchangeOldItemCard")
        .classList
        .remove("hidden");
}


function showExchangeConfirmation() {

    hideAllCards();

    document
        .getElementById("exchangeOldDisplay")
        .innerText =
            oldItem.itemName +
            " — " +
            oldItem.size;

    document
        .getElementById("exchangeNewDisplay")
        .innerText =
            newItem.itemName +
            " — " +
            newItem.size;

    document
        .getElementById("exchangeConfirmCard")
        .classList
        .remove("hidden");
}


/* =========================================================
   CONFIRM PRIMARY ACTION
   ========================================================= */

function confirmPrimaryAction() {

    if (currentMode === "issue") {

        issueItem(false);

        return;
    }

    if (currentMode === "return") {

        returnItem(false);

        return;
    }
}


/* =========================================================
   ISSUE
   ========================================================= */

function issueItem(force) {

    if (!currentStudent) {

        showError(
            "No student is selected."
        );

        return;
    }

    if (!currentItem) {

        showError(
            "No item is selected."
        );

        return;
    }


    /*
     * =====================================================
     * FIX:
     *
     * Use itemBarcode first.
     * Fall back to barcode.
     * =====================================================
     */

    const barcode =
        currentItem.itemBarcode ||
        currentItem.barcode;


    if (!barcode) {

        console.error(
            "Invalid currentItem:",
            currentItem
        );

        showError(
            "The selected item does not have a barcode."
        );

        return;
    }


    const payload = {

        action: "issue",

        studentId:
            String(currentStudent.id),

        itemBarcode:
            String(barcode),

        clerk:
            saveClerk(),

        force:
            force === true

    };


    console.log(
        "ISSUE PAYLOAD:",
        payload
    );


    showLoading(
        "Processing issue..."
    );


    postData(payload)

    .then(function (result) {

        console.log(
            "ISSUE RESPONSE:",
            result
        );


        if (
            !result.success &&
            result.data &&
            result.data.requiresConfirmation
        ) {

            showDuplicateWarning(

                result.message,

                function () {
                    issueItem(true);
                }

            );

            return;
        }


        if (!result.success) {

            showError(
                result.message ||
                "The issue could not be completed."
            );

            return;
        }


        let itemText =
            currentItem.itemName || "Item";


        if (currentItem.size) {

            itemText +=
                " — " +
                currentItem.size;
        }


        let transactionId =
            result.data &&
            result.data.transactionId
                ? result.data.transactionId
                : "Recorded";


        showSuccess(

            "✓ Item Issued",

            (result.message ||
                "Item issued successfully.") +

            "<br><br>" +

            "<strong>" +
            escapeHtml(itemText) +
            "</strong>" +

            "<br><br>" +

            "Transaction: " +
            escapeHtml(transactionId)

        );

    })

    .catch(function (error) {

        console.error(
            "ISSUE ERROR:",
            error
        );

        showError(

            "Issue failed.\n\n" +
            error.message

        );

    });
}


/* =========================================================
   RETURN
   ========================================================= */

function returnItem(force) {

    if (!currentStudent) {

        showError(
            "No student is selected."
        );

        return;
    }

    if (!currentItem) {

        showError(
            "No item is selected."
        );

        return;
    }


    const barcode =
        currentItem.itemBarcode ||
        currentItem.barcode;


    if (!barcode) {

        console.error(
            "Invalid currentItem:",
            currentItem
        );

        showError(
            "The selected item does not have a barcode."
        );

        return;
    }


    const payload = {

        action: "return",

        studentId:
            String(currentStudent.id),

        itemBarcode:
            String(barcode),

        clerk:
            saveClerk(),

        force:
            force === true

    };


    console.log(
        "RETURN PAYLOAD:",
        payload
    );


    showLoading(
        "Processing return..."
    );


    postData(payload)

    .then(function (result) {

        console.log(
            "RETURN RESPONSE:",
            result
        );


        if (
            !result.success &&
            result.data &&
            result.data.requiresConfirmation
        ) {

            showReturnWarning(

                result.message,

                function () {
                    returnItem(true);
                }

            );

            return;
        }


        if (!result.success) {

            showError(
                result.message ||
                "The return could not be completed."
            );

            return;
        }


        let itemText =
            currentItem.itemName || "Item";


        if (currentItem.size) {

            itemText +=
                " — " +
                currentItem.size;
        }


        let transactionId =
            result.data &&
            result.data.transactionId
                ? result.data.transactionId
                : "Recorded";


        showSuccess(

            "✓ Item Returned",

            (result.message ||
                "Item returned successfully.") +

            "<br><br>" +

            "<strong>" +
            escapeHtml(itemText) +
            "</strong>" +

            "<br><br>" +

            "Transaction: " +
            escapeHtml(transactionId)

        );

    })

    .catch(function (error) {

        console.error(
            "RETURN ERROR:",
            error
        );

        showError(

            "Return failed.\n\n" +
            error.message

        );

    });
}


/* =========================================================
   EXCHANGE CONFIRMATION
   ========================================================= */

function confirmExchange() {

    exchangeItems(false);
}


function exchangeItems(force) {

    if (!currentStudent) {

        showError(
            "No student is selected."
        );

        return;
    }

    if (!oldItem || !newItem) {

        showError(
            "Both the old and new items are required."
        );

        return;
    }


    const oldBarcode =
        oldItem.itemBarcode ||
        oldItem.barcode;


    const newBarcode =
        newItem.itemBarcode ||
        newItem.barcode;


    if (!oldBarcode || !newBarcode) {

        console.error(
            "Invalid exchange items:",
            {
                oldItem: oldItem,
                newItem: newItem
            }
        );

        showError(
            "One of the exchange items does not have a barcode."
        );

        return;
    }


    const payload = {

        action: "exchange",

        studentId:
            String(currentStudent.id),

        oldItemBarcode:
            String(oldBarcode),

        newItemBarcode:
            String(newBarcode),

        clerk:
            saveClerk(),

        force:
            force === true

    };


    console.log(
        "EXCHANGE PAYLOAD:",
        payload
    );


    showLoading(
        "Processing exchange..."
    );


    postData(payload)

    .then(function (result) {

        console.log(
            "EXCHANGE RESPONSE:",
            result
        );


        if (
            !result.success &&
            result.data &&
            result.data.requiresConfirmation
        ) {

            showDuplicateWarning(

                result.message,

                function () {
                    exchangeItems(true);
                }

            );

            return;
        }


        if (!result.success) {

            showError(
                result.message ||
                "The exchange could not be completed."
            );

            return;
        }


        const oldName =
            result.data &&
            result.data.oldItem
                ? result.data.oldItem.itemName +
                  " — " +
                  result.data.oldItem.size
                : "Old Item";


        const newName =
            result.data &&
            result.data.newItem
                ? result.data.newItem.itemName +
                  " — " +
                  result.data.newItem.size
                : "New Item";


        const returnTransaction =
            result.data &&
            result.data.returnTransactionId
                ? result.data.returnTransactionId
                : "Recorded";


        const issueTransaction =
            result.data &&
            result.data.issueTransactionId
                ? result.data.issueTransactionId
                : "Recorded";


        showSuccess(

            "✓ Exchange Complete",

            "Returned:<br>" +

            "<strong>" +
            escapeHtml(oldName) +
            "</strong>" +

            "<br><br>" +

            "Issued:<br>" +

            "<strong>" +
            escapeHtml(newName) +
            "</strong>" +

            "<br><br>" +

            "Return Transaction: " +
            escapeHtml(returnTransaction) +

            "<br>" +

            "Issue Transaction: " +
            escapeHtml(issueTransaction)

        );

    })

    .catch(function (error) {

        console.error(
            "EXCHANGE ERROR:",
            error
        );

        showError(

            "Exchange failed.\n\n" +
            error.message

        );

    });
}


/* =========================================================
   VIEW CADET
   ========================================================= */

function loadCadet() {

    showLoading(
        "Loading cadet information..."
    );


    postData({

        action: "viewCadet",

        studentId:
            currentStudent.id

    })

    .then(function (result) {

        console.log(
            "viewCadet response:",
            result
        );


        if (!result.success) {

            showError(
                result.message
            );

            return;
        }


        const student =
            result.data.student;


        document
            .getElementById("cadetName")
            .innerText =
                student.firstName +
                " " +
                student.lastName;


        document
            .getElementById("cadetDetails")
            .innerText =
                formatStudentDetails();


        displayCurrentItems(
            result.data.currentItems
        );


        displayHistory(
            result.data.history
        );


        hideAllCards();


        document
            .getElementById("cadetCard")
            .classList
            .remove("hidden");

    })

    .catch(function (error) {

        console.error(
            "viewCadet error:",
            error
        );

        showError(
            "Could not load cadet information.\n\n" +
            error.message
        );

    });
}


function displayCurrentItems(items) {

    const container =
        document.getElementById(
            "currentItems"
        );


    if (
        !items ||
        items.length === 0
    ) {

        container.innerHTML =
            "<p>No items are currently recorded as issued.</p>";

        return;
    }


    container.innerHTML =
        items.map(function (item) {

            return `

                <div class="item-row">

                    <strong>
                        ${escapeHtml(item.itemName)}
                    </strong>

                    <span>
                        Item Code:
                        ${escapeHtml(item.itemCode)}
                    </span>

                    <br>

                    <span>
                        Barcode:
                        ${escapeHtml(
                            item.itemBarcode ||
                            item.barcode ||
                            ""
                        )}
                    </span>

                </div>

            `;

        }).join("");
}


function displayHistory(history) {

    const container =
        document.getElementById(
            "history"
        );


    if (
        !history ||
        history.length === 0
    ) {

        container.innerHTML =
            "<p>No transaction history.</p>";

        return;
    }


    container.innerHTML =
        history.map(function (txn) {

            const actionClass =
                "action-" +
                txn.action;


            return `

                <div class="history-row">

                    <strong>
                        ${escapeHtml(txn.itemName)}
                    </strong>

                    <span
                        class="${actionClass}">
                        ${escapeHtml(txn.action)}
                    </span>

                    <br>

                    <span>
                        ${escapeHtml(
                            String(txn.timestamp)
                        )}
                    </span>

                    <br>

                    <span>
                        Transaction:
                        ${escapeHtml(
                            txn.transactionId
                        )}
                    </span>

                    <br>

                    <span>
                        Clerk:
                        ${escapeHtml(
                            txn.clerk
                        )}
                    </span>

                </div>

            `;

        }).join("");
}


/* =========================================================
   SCANNER
   ========================================================= */

function showScanner(title) {

    hideAllCards();


    document
        .getElementById("scannerCard")
        .classList
        .remove("hidden");


    document
        .getElementById("scannerTitle")
        .innerText =
            title;


    scanner =
        new Html5Qrcode("reader");


    scanner.start(

        {
            facingMode:
                "environment"
        },

        {
            fps: 10,

            qrbox: {
                width: 280,
                height: 140
            }

        },

        function (decodedText) {

            stopScanner();

            handleBarcode(
                decodedText
            );

        },

        function (errorMessage) {

            // Continuous scanner errors
            // are intentionally ignored.

        }

    )

    .catch(function (error) {

        showError(

            "Camera could not start. " +
            "Make sure the browser has permission " +
            "to use the camera."

        );

        console.error(error);

    });
}


function stopScanner() {

    if (!scanner) {

        return;
    }


    scanner.stop()

        .then(function () {

            scanner.clear();

        })

        .catch(function () {

            try {
                scanner.clear();
            }
            catch (e) {}

        });


    scanner = null;


    document
        .getElementById("scannerCard")
        .classList
        .add("hidden");
}


function handleBarcode(barcode) {

    barcode =
        String(barcode).trim();


    if (!barcode) {

        showError(
            "The scanner returned an empty barcode."
        );

        return;
    }


    if (scannerMode === "student") {

        lookupStudent(barcode);

        return;
    }


    if (scannerMode === "item") {

        lookupItem(barcode);

        return;
    }
}


/* =========================================================
   MANUAL ENTRY
   ========================================================= */

function submitManualEntry() {

    const input =
        document.getElementById(
            "manualInput"
        );


    const value =
        input.value.trim();


    if (!value) {

        alert(
            "Please enter a barcode."
        );

        input.focus();

        return;
    }


    if (
        currentMode === "issue" ||
        currentMode === "return" ||
        currentMode === "exchange"
    ) {

        if (!currentStudent) {

            lookupStudent(value);

        }

        else {

            lookupItem(value);

        }

        return;
    }


    if (currentMode === "view") {

        lookupStudent(value);

        return;
    }
}


/* =========================================================
   UI HELPERS
   ========================================================= */

function hideAllCards() {

    const ids = [

        "home",
        "studentCard",
        "returnStudentCard",
        "exchangeStudentCard",
        "itemCard",
        "exchangeOldItemCard",
        "exchangeConfirmCard",
        "cadetCard",
        "scannerCard",
        "manualCard",
        "statusCard"

    ];


    ids.forEach(function (id) {

        const element =
            document.getElementById(id);


        if (element) {

            element
                .classList
                .add("hidden");

        }

    });
}


function showLoading(message) {

    hideAllCards();


    document
        .getElementById("statusCard")
        .classList
        .remove("hidden");


    document
        .getElementById("statusTitle")
        .innerText =
            "Please Wait";


    document
        .getElementById("statusMessage")
        .className =
            "status";


    document
        .getElementById("statusMessage")
        .innerHTML =

            `<div class="loading">
                ${escapeHtml(message)}
             </div>`;
}


function showSuccess(
    title,
    message
) {

    hideAllCards();


    document
        .getElementById("statusCard")
        .classList
        .remove("hidden");


    document
        .getElementById("statusTitle")
        .innerText =
            title;


    document
        .getElementById("statusMessage")
        .className =
            "status success";


    document
        .getElementById("statusMessage")
        .innerHTML =
            message;
}


function showError(message) {

    hideAllCards();


    document
        .getElementById("statusCard")
        .classList
        .remove("hidden");


    document
        .getElementById("statusTitle")
        .innerText =
            "⚠ Error";


    document
        .getElementById("statusMessage")
        .className =
            "status error";


    document
        .getElementById("statusMessage")
        .innerText =
            message;
}


function showDuplicateWarning(
    message,
    confirmFunction
) {

    hideAllCards();


    const card =
        document.getElementById(
            "statusCard"
        );


    card.classList.remove(
        "hidden"
    );


    document
        .getElementById("statusTitle")
        .innerText =
            "⚠ Duplicate / Conflict";


    document
        .getElementById("statusMessage")
        .className =
            "status warning";


    document
        .getElementById("statusMessage")
        .innerText =
            message;


    const button =
        document.createElement(
            "button"
        );


    button.className =
        "warning";


    button.innerText =
        "Proceed Anyway";


    button.onclick =
        confirmFunction;


    card.appendChild(
        button
    );


    const cancel =
        document.createElement(
            "button"
        );


    cancel.className =
        "secondary";


    cancel.innerText =
        "Cancel";


    cancel.onclick =
        resetApp;


    card.appendChild(
        cancel
    );
}


function showReturnWarning(
    message,
    confirmFunction
) {

    showDuplicateWarning(
        message,
        confirmFunction
    );
}


/* =========================================================
   API
   ========================================================= */

function postData(data) {

    console.log(
        "API REQUEST:",
        data
    );


    const controller =
        new AbortController();


    const timeout =
        setTimeout(function () {

            controller.abort();

        }, 20000);


    return fetch(

        APPS_SCRIPT_URL,

        {

            method:
                "POST",

            headers: {

                "Content-Type":
                    "text/plain;charset=utf-8"

            },

            body:
                JSON.stringify(data),

            signal:
                controller.signal

        }

    )

    .then(function (response) {

        clearTimeout(timeout);


        console.log(
            "API HTTP STATUS:",
            response.status
        );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        return response.text();

    })

    .then(function (text) {

        console.log(
            "API RAW RESPONSE:",
            text
        );


        if (!text) {

            throw new Error(
                "The Supply server returned an empty response."
            );
        }


        let result;


        try {

            result =
                JSON.parse(text);

        }

        catch (error) {

            console.error(
                "Invalid JSON response:",
                text
            );

            throw new Error(
                "The Supply server returned invalid data."
            );
        }


        console.log(
            "API PARSED RESPONSE:",
            result
        );


        return result;

    })

    .catch(function (error) {

        clearTimeout(timeout);


        if (
            error.name === "AbortError"
        ) {

            throw new Error(
                "The Supply server did not respond within 20 seconds."
            );
        }


        throw error;

    });
}


/* =========================================================
   RESET
   ========================================================= */

function resetApp() {

    stopScanner();


    currentStudent = null;

    currentItem = null;

    oldItem = null;

    newItem = null;

    currentMode = null;

    scannerMode = null;


    location.reload();
}


/* =========================================================
   HTML SAFETY
   ========================================================= */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}
